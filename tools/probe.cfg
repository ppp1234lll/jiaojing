# OpenOCD 一次性探针: 读取设备运行中的网络/任务状态, 读取后 resume 继续运行
proc countlist {head name} {
    set p [lindex [read_memory $head 32 1] 0]
    set n 0
    while {$p != 0 && $n < 300} {
        set p [lindex [read_memory $p 32 1] 0]
        incr n
    }
    echo [format "%s count=%d" $name $n]
}

init

echo "==== lwipdev fields ===="
set b [read_memory 0x2001cc14 8 56]
echo [format "init=%d netif=%d tcp_status=%d srv_status=%d srv_link=%d tcp_client1=%d tcp_client_backup=%d client_websocket_id=%d" \
    [lindex $b 0] [lindex $b 1] [lindex $b 2] [lindex $b 4] [lindex $b 7] [lindex $b 44] [lindex $b 48] [lindex $b 53]]

echo "==== conn pointers ===="
set w [read_memory 0x1000005c 32 8]
echo [format "client1_conn=0x%08x backup_conn=0x%08x c1_flag=0x%04x" [lindex $w 0] [lindex $w 4] [lindex $w 3]]
set s [read_memory 0x1000009c 32 2]
echo [format "server_conn=0x%08x server_newconn=0x%08x" [lindex $s 0] [lindex $s 1]]

echo "==== tcp pcb lists ===="
countlist 0x200002f4 "tcp_bound_pcbs"
countlist 0x200002f8 "tcp_listen_pcbs"
countlist 0x200002fc "tcp_active_pcbs"
countlist 0x20000300 "tcp_tw_pcbs"

echo "==== OSTCBPrioTbl (non-null) ===="
set tbl 0x1000a588
for {set i 0} {$i < 64} {incr i} {
    set v [lindex [read_memory [expr {$tbl + $i*4}] 32 1] 0]
    if {$v != 0} {
        set st [lindex [read_memory [expr {$v + 0x1c}] 8 1] 0]
        set pr [lindex [read_memory [expr {$v + 0x1d}] 8 1] 0]
        echo [format "prio %d TCB=0x%08x OSTCBStat=0x%02x OSTCBPrio=%d" $i $v $st $pr]
    }
}

resume
exit
