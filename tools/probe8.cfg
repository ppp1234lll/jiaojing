# OpenOCD 探针8: 抓各任务阻塞状态(判断是哪个任务卡住) + 连接/PCB/计数
init

echo "== TASKS (t = TCB+0x14: next,prev,evptr,msg,w4,w5,w6) =="
set tbl 0x1000a588
foreach p {3 5 6 7 10 11 12 13 19} {
    set v [lindex [read_memory [expr {$tbl + $p*4}] 32 1] 0]
    if {$v != 0} {
        set t [read_memory [expr {$v + 0x14}] 32 8]
        echo [format "prio %d TCB=0x%08x next=0x%08x prev=0x%08x evptr=0x%08x msg=0x%08x w4=0x%08x w5=0x%08x w6=0x%08x" \
            $p $v [lindex $t 0] [lindex $t 1] [lindex $t 2] [lindex $t 3] [lindex $t 4] [lindex $t 5] [lindex $t 6]]
    } else {
        echo [format "prio %d no-task" $p]
    }
}

echo "== lwipdev 0x2001cc4c =="
mdw 0x2001cc4c 14
echo "== conn ptrs =="
mdw 0x1000005c 8
mdw 0x1000009c 2
echo "== pcb list heads =="
mdw 0x200002f8 3

resume
exit
