# OpenOCD 探针7: 经 MDIO 读 LAN8720 PHY 状态 + ETH DMA 寄存器 (判断链路/收发路径)
proc mdio_read {phy reg} {
    set val [expr {($phy << 11) | ($reg << 6) | (4 << 2) | 1}]
    mww 0x40028014 $val
    set i 0
    while {$i < 300} {
        set r [lindex [read_memory 0x40028014 32 1] 0]
        if {($r & 1) == 0} { break }
        incr i
    }
    return [lindex [read_memory 0x40028018 32 1] 0]
}
init

echo "== PHY (BSR bit2=Link up, bit5=AutoNeg done) =="
echo [format "PHY0 BSR=0x%08x ID1=0x%08x ID2=0x%08x" [mdio_read 0 1] [mdio_read 0 2] [mdio_read 0 3]]
echo [format "PHY1 BSR=0x%08x ID1=0x%08x" [mdio_read 1 1] [mdio_read 1 2]]

echo "== ETH DMA (0x14=DMASR,0x18=DMAOMR,0x48=CHTDR,0x4c=CHRDR) =="
mdw 0x40029014 2
mdw 0x40029048 2
echo "== desc lists =="
mdw 0x4002901c 2

resume
exit
