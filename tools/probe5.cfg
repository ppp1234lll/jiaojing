# OpenOCD 探针5: 统计 uCOS 队列/事件对象池的空闲链表长度(定位资源泄漏/耗尽)
proc countfreelist {head nextoff} {
    set p $head
    set n 0
    while {$p != 0 && $n < 80} {
        set p [lindex [read_memory [expr {$p + $nextoff}] 32 1] 0]
        incr n
    }
    return $n
}
init

echo "==== free lists ===="
set q [lindex [read_memory 0x100000e8 32 1] 0]
set e [lindex [read_memory 0x100000a8 32 1] 0]
echo [format "OSQFreeList=0x%08x freeQ=%d (max 10)" $q [countfreelist $q 0]]
echo [format "OSEventFreeList=0x%08x freeEvent=%d (max 30)" $e [countfreelist $e 4]]

echo "==== OSQTbl ===="
set tbl 0x1000ad0c
for {set i 0} {$i < 10} {incr i} {
    set a [expr {$tbl + $i*24}]
    set ptr [lindex [read_memory $a 32 1] 0]
    set sz [lindex [read_memory [expr {$a + 20}] 16 1] 0]
    set nm [lindex [read_memory [expr {$a + 22}] 16 1] 0]
    echo [format "Q%d ptr=0x%08x size=%d nmsgs=%d" $i $ptr $sz $nm]
}

resume
exit
