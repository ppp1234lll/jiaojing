# OpenOCD 探针12: 统计 TCP PCB 各链表长度(struct tcp_pcb.next 偏移=12)
# 用法: openocd ... -c "init" -c "halt" -f tools/probe12.cfg
proc cnt {head} {
    set p $head
    set n 0
    while {$p != 0 && $n < 200} {
        set p [lindex [read_memory [expr {$p + 12}] 32 1] 0]
        incr n
    }
    return $n
}

echo [format "bound=%d listen=%d active=%d tw=%d" \
    [cnt [lindex [read_memory 0x20000320 32 1] 0]] \
    [cnt [lindex [read_memory 0x20000324 32 1] 0]] \
    [cnt [lindex [read_memory 0x20000328 32 1] 0]] \
    [cnt [lindex [read_memory 0x2000032c 32 1] 0]]]

resume
exit
