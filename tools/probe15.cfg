# OpenOCD 探针15: uCOS 队列/事件池空闲数(地址按当前 map 自动核对)
# Q@0x100000f0 -> OS_Q free list (head 0x1000b26c), EV@0x100000b0 -> OS_EVENT free list (head 0x1000a1c8)
proc fl {head off} {
    set p $head
    set n 0
    while {$p != 0 && $n < 200} {
        set p [lindex [read_memory [expr {$p + $off}] 32 1] 0]
        incr n
    }
    return $n
}
echo [format "freeQ=%d freeEvent=%d" \
    [fl 0x1000b26c 0] \
    [fl 0x1000a1c8 4]]
resume
exit
