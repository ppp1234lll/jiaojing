# OpenOCD 探针4: 定位服务器线程/client1 任务卡点(netconn 邮箱/信号量 + TCB 事件指针)
proc cnt {ev} {
    if {$ev == 0} { return -1 }
    return [lindex [read_memory [expr {$ev + 8}] 16 1] 0]
}
init

echo "==== server netconn ===="
set s [lindex [read_memory 0x1000009c 32 1] 0]
echo [format "server_conn=0x%08x" $s]
if {$s != 0} {
    set f [read_memory [expr {$s + 0x10}] 32 3]
    echo [format "op=0x%08x recvmbox=0x%08x acceptmbox=0x%08x" [lindex $f 0] [lindex $f 1] [lindex $f 2]]
    echo [format "cnt op=%d recv=%d accept=%d" [cnt [lindex $f 0]] [cnt [lindex $f 1]] [cnt [lindex $f 2]]]
}

echo "==== client1 netconn ===="
set c [lindex [read_memory 0x1000005c 32 1] 0]
echo [format "client1_conn=0x%08x" $c]
if {$c != 0} {
    set f [read_memory [expr {$c + 0x10}] 32 3]
    echo [format "op=0x%08x recvmbox=0x%08x acceptmbox=0x%08x" [lindex $f 0] [lindex $f 1] [lindex $f 2]]
    echo [format "cnt op=%d recv=%d accept=%d" [cnt [lindex $f 0]] [cnt [lindex $f 1]] [cnt [lindex $f 2]]]
}

echo "==== TCBs (prio 5/6/7/10/11) ===="
set tbl 0x1000a588
foreach p {5 6 7 10 11} {
    set v [lindex [read_memory [expr {$tbl + $p*4}] 32 1] 0]
    if {$v != 0} {
        set id [lindex [read_memory [expr {$v + 0x12}] 16 1] 0]
        set t [read_memory [expr {$v + 0x14}] 32 8]
        echo [format "prio %d id=%d TCB=0x%08x next=0x%08x prev=0x%08x evptr=0x%08x msg=0x%08x w4=0x%08x w5=0x%08x w6=0x%08x" \
            $p $id $v [lindex $t 0] [lindex $t 1] [lindex $t 2] [lindex $t 3] [lindex $t 4] [lindex $t 5] [lindex $t 6]]
    }
}

resume
exit
