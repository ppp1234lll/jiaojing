# OpenOCD 探针11: 检查 tcpip 邮箱里是否积压了 TCPIP_MSG_INPKT 消息
# 用法: openocd ... -c "init" -c "halt" -f tools/probe11.cfg
set mb [lindex [read_memory 0x200003c8 32 1] 0]
echo [format "tcpip mbox=0x%08x" $mb]
if {$mb != 0} {
    set q [lindex [read_memory $mb 32 1] 0]
    echo [format "pQ=0x%08x" $q]
    if {$q != 0} {
        echo [format "queued OSEventCnt=%d" [lindex [read_memory [expr {$q + 8}] 16 1] 0]]
    }
    echo "== queued msg pointers (first 8) =="
    mdw [expr {$mb + 4}] 8
}

echo "== ETH counters =="
mdw 0x2000008c 11

resume
exit
