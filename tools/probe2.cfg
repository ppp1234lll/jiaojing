# OpenOCD 探针2: 统计 LwIP 内存池占用 + 连接/PCB/任务状态; 读取后 resume
proc freelist {head} {
    set p $head
    set n 0
    while {$p != 0 && $n < 600} {
        set p [lindex [read_memory $p 32 1] 0]
        incr n
    }
    return $n
}
proc countlist {head name} {
    set p [lindex [read_memory $head 32 1] 0]
    set n 0
    while {$p != 0 && $n < 300} {
        set p [lindex [read_memory $p 32 1] 0]
        incr n
    }
    echo [format "%s count=%d" $name $n]
}

init

echo "==== lwipdev ===="
set b [read_memory 0x2001cc14 8 56]
echo [format "netif=%d srv_status=%d srv_link=%d tcp_client1=%d tcp_client_backup=%d ws_id=%d" \
    [lindex $b 1] [lindex $b 4] [lindex $b 7] [lindex $b 44] [lindex $b 48] [lindex $b 53]]
set w [read_memory 0x1000005c 32 8]
echo [format "client1_conn=0x%08x backup_conn=0x%08x" [lindex $w 0] [lindex $w 4]]

echo "==== memp pools (index total free used) ===="
set nums [read_memory 0x08073184 16 16]
set tabs [read_memory 0x2001dbc8 32 16]
for {set i 0} {$i < 16} {incr i} {
    set t [lindex $nums $i]
    if {$t != 0} {
        set f [freelist [lindex $tabs $i]]
        echo [format "memp idx=%d total=%d free=%d used=%d" $i $t $f [expr {$t - $f}]]
    }
}

echo "==== tcp pcb lists ===="
countlist 0x200002f8 "tcp_listen_pcbs"
countlist 0x200002fc "tcp_active_pcbs"
countlist 0x20000300 "tcp_tw_pcbs"

echo "==== OSTCBPrioTbl (non-null) ===="
set tbl 0x1000a588
for {set i 0} {$i < 64} {incr i} {
    set v [lindex [read_memory [expr {$tbl + $i*4}] 32 1] 0]
    if {$v != 0} {
        echo [format "prio %d TCB=0x%08x" $i $v]
    }
}

resume
exit
