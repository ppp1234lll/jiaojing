# OpenOCD 探针: UDP搜索问题诊断
# 用法: openocd -f interface/stlink.cfg -f target/stm32f4x.cfg -f probe_udp.cfg
# 地址来源: main/Debug/data_collect.map (与当前固件同一次编译)

init
halt

echo "== lwipdev (init netif_state tcp_status udp_mcast_status tcp_srv_status ... reset ...) =="
mdb 0x2001cd54 8
echo "  lwipdev.ip ="
mdb 0x2001cd66 4
echo "  lwipdev.netmask ="
mdb 0x2001cd76 4
echo "  lwipdev.udp_multicast_reset / reset ="
mdb 0x2001cd7c 2

echo "== 组播配置 sg_sysparam_t.local =="
echo "  local.ip ="
mdb 0x10005e30 4
echo "  local.port ="
mdw 0x10005e38
echo "  local.multicast_ip ="
mdb 0x10005e55 4
echo "  local.multicast_port ="
mdw 0x10005e58

echo "== UDP组播任务状态 =="
echo "  udp_flag(0x8000=有待发送数据) udp_sock(-1=无socket) ="
mdh 0x20000144
mdw 0x20000148

echo "== print接收状态 (recv_flag | send_flag: search inquiry mac relay ip ret) =="
mdb 0x200012a8 1
mdb 0x200012b0 6

echo "== print_param.id / types(最后解析结果) =="
mdw 0x20001244
echo "  types ="
mdb 0x2000124e 15

echo "== print_buff 最初128字节(最后收到的探测包内容) ="
mdb 0x20001020 128

echo "== tcpip 心跳计数(两次读,有增长=tcpip线程活着) ="
mdw 0x200004a4
sleep 500
mdw 0x200004a4

resume
shutdown
