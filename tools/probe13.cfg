# OpenOCD 探针13: 读取 tcpip 邮箱真实排队消息数(TQ_DESCR.pQ -> OS_EVENT.OSEventPtr -> OS_Q.OSQNMsgs)
# 用法: openocd ... -c "init" -c "halt" -f tools/probe13.cfg
set mb [lindex [read_memory 0x200003c8 32 1] 0]
echo [format "mbox=0x%08x" $mb]
if {$mb != 0} {
    set q [lindex [read_memory $mb 32 1] 0]
    echo [format "OS_EVENT=0x%08x" $q]
    if {$q != 0} {
        set oq [lindex [read_memory [expr {$q + 4}] 32 1] 0]
        echo [format "OS_Q=0x%08x" $oq]
        if {$oq != 0} {
            echo [format "queue depth OSQNMsgs=%d OSQSize=%d" \
                [lindex [read_memory [expr {$oq + 22}] 16 1] 0] \
                [lindex [read_memory [expr {$oq + 20}] 16 1] 0]]
        }
    }
    echo "== first 8 queued pointers =="
    mdw [expr {$mb + 4}] 8
}
resume
exit
