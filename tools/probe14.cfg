# OpenOCD 探针14: LwIP memp 各池空闲数 + uCOS 队列/事件池空闲数
# 用法: openocd ... -c "init" -c "halt" -f tools/probe14.cfg
proc fl {head off} {
    set p $head
    set n 0
    while {$p != 0 && $n < 200} {
        set p [lindex [read_memory [expr {$p + $off}] 32 1] 0]
        incr n
    }
    return $n
}

echo "== memp free lists =="
set tabs [read_memory 0x2001dc38 32 16]
for {set i 0} {$i < 16} {incr i} {
    echo [format "memp idx=%d free=%d" $i [fl [lindex $tabs $i] 0]]
}

echo "== uCOS pools =="
echo [format "freeQ=%d freeEvent=%d" \
    [fl [lindex [read_memory 0x100000e8 32 1] 0] 0] \
    [fl [lindex [read_memory 0x100000a8 32 1] 0] 4]]

resume
exit
