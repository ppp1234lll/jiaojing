# OpenOCD 探针9: ETH/网络诊断计数 + lwipdev
init
halt

echo "== ETH counters (init irq rx rx_err tx tx_err net_reset eth_reset link_down ll_in_null ll_out_err) =="
mdw 0x2000008c 11

echo "== SYS counters (mbox_new fail free | sem_new free | nc_alloc free | leak_rcv leak_acc postfail | delconn close close_fail err_tcp) =="
mdw 0x20000380 14

echo "== lwipdev =="
mdw 0x2001cc7c 14

resume
exit
