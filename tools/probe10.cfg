# OpenOCD 探针10: 遍历 memp_tab 各内存池空闲链表 + ETH/SYS 计数
# 用法: openocd ... -c "init" -c "halt" -f tools/probe10.cfg
proc fl {head} {
    set p $head
    set n 0
    while {$p != 0 && $n < 120} {
        set p [lindex [read_memory $p 32 1] 0]
        incr n
    }
    return $n
}

echo "== memp free lists (idx free) =="
set tabs [read_memory 0x2001dc30 32 16]
for {set i 0} {$i < 16} {incr i} {
    echo [format "memp idx=%d free=%d" $i [fl [lindex $tabs $i]]]
}

echo "== ETH counters =="
mdw 0x2000008c 11

resume
exit
