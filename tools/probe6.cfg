# OpenOCD 探针6: 读取资源泄漏调试计数 + uCOS 池空闲链表长度
proc countfl {head off} {
    set p $head
    set n 0
    while {$p != 0 && $n < 100} {
        set p [lindex [read_memory [expr {$p + $off}] 32 1] 0]
        incr n
    }
    return $n
}
init

set q [lindex [read_memory 0x100000e8 32 1] 0]
set e [lindex [read_memory 0x100000a8 32 1] 0]
echo [format "POOL freeQ=%d/30 freeEvent=%d/30" [countfl $q 0] [countfl $e 4]]

set c [read_memory 0x20000354 32 16]
echo [format "CTR mbox_new=%d mbox_fail=%d mbox_free=%d | liveMbox=%d" \
    [lindex $c 0] [lindex $c 1] [lindex $c 2] [expr {[lindex $c 0]-[lindex $c 2]}]]
echo [format "CTR sem_new=%d sem_free=%d | liveSem=%d" \
    [lindex $c 3] [lindex $c 4] [expr {[lindex $c 3]-[lindex $c 4]}]]
echo [format "CTR nc_alloc=%d nc_free=%d | liveNc=%d" \
    [lindex $c 5] [lindex $c 6] [expr {[lindex $c 5]-[lindex $c 6]}]]
echo [format "CTR leak_rcv=%d leak_acc=%d postfail=%d" [lindex $c 7] [lindex $c 8] [lindex $c 9]]
echo [format "CTR delconn_inprog=%d close_inprog=%d close_fail=%d err_tcp=%d" \
    [lindex $c 10] [lindex $c 11] [lindex $c 12] [lindex $c 13]]

resume
exit
