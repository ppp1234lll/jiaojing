# OpenOCD 探针3: 任务表 + PCB 链表头 + 关键状态; 读取后 resume
init

echo "==== lwipdev ===="
set b [read_memory 0x2001cc14 8 56]
echo [format "netif=%d srv_status=%d srv_link=%d tcp_client1=%d tcp_client_backup=%d ws_id=%d" \
    [lindex $b 1] [lindex $b 4] [lindex $b 7] [lindex $b 44] [lindex $b 48] [lindex $b 53]]
set w [read_memory 0x1000005c 32 8]
echo [format "client1_conn=0x%08x backup_conn=0x%08x" [lindex $w 0] [lindex $w 4]]

echo "==== OSTCBPrioTbl (non-null) ===="
set tbl 0x1000a588
for {set i 0} {$i < 40} {incr i} {
    set v [lindex [read_memory [expr {$tbl + $i*4}] 32 1] 0]
    if {$v != 0} {
        echo [format "prio %d TCB=0x%08x" $i $v]
    }
}

echo "==== tcp pcb list heads ===="
set a [read_memory 0x200002f4 32 4]
echo [format "bound=0x%08x listen=0x%08x active=0x%08x tw=0x%08x" \
    [lindex $a 0] [lindex $a 1] [lindex $a 2] [lindex $a 3]]

echo "==== server netconn ===="
set s [read_memory 0x1000009c 32 2]
echo [format "server_conn=0x%08x server_newconn=0x%08x" [lindex $s 0] [lindex $s 1]]

resume
exit
